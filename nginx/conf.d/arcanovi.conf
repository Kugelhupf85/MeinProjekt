# =====================================================================================
# 🌐 ARCANOVI NGINX MAIN CONFIGURATION TEMPLATE
# =====================================================================================
# ⚠️ TEMPLATE DATEI: Umgebungsvariablen werden durch envsubst ersetzt!
# ⚠️ ALLE Werte stammen aus der zentralen .env Datei!
# 
# 📍 TEMPLATE SUBSTITUTION:
#    - $SERVER_NAME → aus .env: SERVER_NAME
#    - $CORS_ALLOW_ORIGIN → aus .env: CORS_ALLOW_ORIGIN  
#    - $ENGINE_CONTAINER_NAME → aus .env: ENGINE_CONTAINER_NAME
#    - $ENGINE_INTERNAL_PORT → aus .env: ENGINE_INTERNAL_PORT
#    - $FRONTEND_CONTAINER_NAME → aus .env: FRONTEND_CONTAINER_NAME
#    - $FRONTEND_INTERNAL_PORT → aus .env: FRONTEND_INTERNAL_PORT
# =====================================================================================

# Upstream für Django Backend
upstream arcanovi_backend {
    server $ENGINE_CONTAINER_NAME:$ENGINE_INTERNAL_PORT;
}

# Upstream für React Frontend (Development)
upstream arcanovi_frontend {
    server $FRONTEND_CONTAINER_NAME:$FRONTEND_INTERNAL_PORT;
}

# =====================================================================================
# 🌐 MAIN SERVER BLOCK
# =====================================================================================
server {
    listen 80;
    server_name $SERVER_NAME;
    
    # Basis-Logging
    access_log /var/log/nginx/arcanovi_access.log;
    error_log /var/log/nginx/arcanovi_error.log;

    # Basis-Sicherheitsheader
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =====================================================================================
    # 🏥 HEALTH CHECK ENDPOINT
    # =====================================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =====================================================================================
    # 🔧 DJANGO BACKEND API ROUTES - MIT CORS
    # =====================================================================================
    location /api/ {
        # CORS Headers - ⚠️ AUS .env: CORS_ALLOW_ORIGIN
        add_header 'Access-Control-Allow-Origin' '$CORS_ALLOW_ORIGIN' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRFToken' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        
        # Preflight OPTIONS Requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$CORS_ALLOW_ORIGIN' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRFToken' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Proxy zu Django Backend
        proxy_pass http://arcanovi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Erweiterte Proxy-Konfiguration
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 64k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
    }

    # =====================================================================================
    # 🗄️ DJANGO ADMIN ROUTES
    # =====================================================================================
    location /admin/ {
        proxy_pass http://arcanovi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # =====================================================================================
    # 📁 STATIC FILES (Django Backend)
    # =====================================================================================
    location /static/ {
        alias /static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header 'Access-Control-Allow-Origin' '$CORS_ALLOW_ORIGIN' always;
        access_log off;
    }

    # =====================================================================================
    # 🖼️ MEDIA FILES (Django Backend)
    # =====================================================================================
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header 'Access-Control-Allow-Origin' '$CORS_ALLOW_ORIGIN' always;
        access_log off;
    }

    # =====================================================================================
    # ⚛️ REACT FRONTEND (DEVELOPMENT PROXY)
    # =====================================================================================
    # Alle anderen Requests gehen an das React Frontend
    location / {
        # Spezielle Frontend-Assets mit besserer Cache-Kontrolle
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://arcanovi_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache-Kontrolle für Assets
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header 'Access-Control-Allow-Origin' '$CORS_ALLOW_ORIGIN' always;
        }

        # Standard Frontend Proxy
        proxy_pass http://arcanovi_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Erweiterte Proxy-Konfiguration für Frontend
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 64k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;

        # WebSocket Support für HMR (Hot Module Replacement)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # CORS für Frontend
        add_header 'Access-Control-Allow-Origin' '$CORS_ALLOW_ORIGIN' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # =====================================================================================
    # 🚫 SECURITY: Verstecke sensible Dateien
    # =====================================================================================
    location ~ /\.ht {
        deny all;
    }
    
    location ~ /\.env {
        deny all;
    }
    
    location ~ /\.git {
        deny all;
    }
} 